[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faroflow"
version = "0.1.0"
description = "Manual-first personal project management assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<12",
  "pydantic-settings>=2.7,<3",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.9,<1",
  "pytesseract>=0.3.13,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
faroflow = "faroflow.cli:main"
cuentafaro = "cuentafaro.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.26.0",
  "xlwt>=1.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faroflow", "src/cuentafaro"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_finance"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
"finance_migrations/versions/*" = ["E501"]
